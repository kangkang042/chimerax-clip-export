[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimerax-clip-export"
version = "0.1.1"
description = "Export ChimeraX global clip plane settings as a reusable command string"
requires-python = ">=3.9"
dynamic = []
dependencies = [
    "chimerax-core>=1.0",
]

[project.entry-points."chimerax.bundle"]
bundle = "chimerax.clip_export"

[tool.chimerax]
name = "Clip-Export"
version = "0.1.1"
description = "Export global clip plane settings as a reusable command string"
min-session-version = "1"
max-session-version = "1"
category = "General"
module-name-override = "clip_export"

[tool.chimerax.command.clipstate]
synopsis = "Export current clip plane settings to Log"
category = "General"

[tool.setuptools.packages.find]
where = ["src"]
